# docker-compose.yml
#
# 단일 진입점: docker compose up --build
#   - oracle-db : Oracle Free 23c 대상 DB (항상 기동)
#   - api        : FastAPI 진단 서비스 (항상 기동, oracle-db 의존)
#
# Langfuse 셀프호스팅이 필요하면 --profile langfuse 추가:
#   docker compose --profile langfuse up --build
#
# 비밀값·포트·볼륨은 .env (또는 .env.example 참고) 로 설정한다.

services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: sql-tuning-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-OracleFree_2026!}
      # 주의: ORACLE_DATABASE를 여기에 "FREEPDB1"로 설정하면 안 된다 — 이미지가 기본으로 이미
      # 만드는 기본 PDB와 이름이 겹쳐 ORA-65012(already exists)가 나고, entrypoint가 "첫 초기화"
      # 분기를 이탈해 /container-entrypoint-initdb.d 커스텀 스크립트를 아예 실행하지 않게 된다.
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      # 최초 기동 시(빈 볼륨일 때) 1회만 실행되는 스키마/데이터 초기화 스크립트
      - ./db/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "/opt/oracle/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  api:
    build: .
    container_name: sql-tuning-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # 고정값: .env의 ORACLE_DSN은 호스트에서 직접 실행할 때 쓰는 localhost 값이라, 여기서
      # ${ORACLE_DSN:-...}로 두면 그 값이 그대로 흡수돼 컨테이너 안에서 "localhost"를 가리키게
      # 되고(자기 자신), Oracle 리스너가 없어 ORA-12541로 깨진다. 컴포즈 네트워크에서 오라클은
      # 항상 oracle-db 호스트명이므로 오버라이드 불가하게 고정한다.
      ORACLE_DSN: oracle-db:1521/FREEPDB1
      ORACLE_APP_USER: ${ORACLE_APP_USER:-appuser}
      ORACLE_APP_PASSWORD: ${ORACLE_APP_PASSWORD:-AppUser_2026!}
      SQLCL_CONNECTION_NAME: ${SQLCL_CONNECTION_NAME:-mini_pjt_conn}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # 고정값: .env의 LANGFUSE_HOST는 호스트 브라우저가 접속하는 localhost 값이라, 여기서
      # ${LANGFUSE_HOST:-...}로 두면 그 값이 그대로 흡수돼 컨테이너 안에서 "localhost"(=api
      # 컨테이너 자신)를 가리키게 된다 — ORACLE_DSN과 같은 문제. 컴포즈 네트워크 안에서
      # langfuse-web은 항상 langfuse-web 호스트명이므로 오버라이드 불가하게 고정한다.
      LANGFUSE_HOST: http://langfuse-web:3000
      APPROVER_TOKEN: ${APPROVER_TOKEN:-demo-approver-token}
    depends_on:
      oracle-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # --- Langfuse 셀프호스팅 (Observability) ---
  # 기본 기동에서는 포함되지 않는다. --profile langfuse 를 추가해야 기동한다.
  # src/tracing.py의 langfuse_callbacks()는 LANGFUSE_PUBLIC_KEY/SECRET_KEY가 없으면
  # 빈 리스트를 반환하므로 Langfuse 없이도 API는 정상 동작한다.
  langfuse-postgres:
    profiles: [langfuse]
    image: postgres:16-alpine
    container_name: langfuse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  langfuse-clickhouse:
    profiles: [langfuse]
    image: clickhouse/clickhouse-server
    container_name: langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-changeme}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-redis:
    profiles: [langfuse]
    image: redis:7-alpine
    container_name: langfuse-redis
    restart: unless-stopped
    command: --requirepass ${LANGFUSE_REDIS_AUTH:-changeme}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-minio:
    profiles: [langfuse]
    # Docker Hub의 minio/minio는 인증 없이는 pull이 막혀 있다(2025년경 정책 변경) -> quay.io 미러 사용.
    image: quay.io/minio/minio
    container_name: langfuse-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:-changeme}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  langfuse-worker:
    profiles: [langfuse]
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    environment: &langfuse-worker-env
      DATABASE_URL: postgresql://postgres:postgres@langfuse-postgres:5432/postgres
      SALT: ${LANGFUSE_SALT:-changeme_random_hex}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-changeme_64_hex_chars_pad_to_64_chars_with_zeros00}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-changeme}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-changeme}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-changeme}

  langfuse-web:
    profiles: [langfuse]
    image: langfuse/langfuse:3
    container_name: langfuse-web
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme_random_hex}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-mini-pjt}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-oracle-sql-perf-agent}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}

volumes:
  oracle-data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
