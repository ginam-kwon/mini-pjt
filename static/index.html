<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oracle SQL Copilot</title>
<style>
  /* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V4 */
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel-2: #1e273b; --border: #2a3552;
    --text: #e6ebf5; --muted: #8a95ad; --accent: #5b8cff;
    --red: #ff6b6b; --amber: #ffb454; --green: #4ade80;
    --code-bg: #0b0f18;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  #health-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 6px; }
  #health-dot.ok { background: var(--green); }
  #health-dot.bad { background: var(--red); }

  .layout {
    display: grid; grid-template-columns: 1fr 340px; gap: 16px;
    padding: 16px; max-width: 1280px; margin: 0 auto;
  }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .main { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }

  /* token input */
  .token-bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--panel-2); border-bottom: 1px solid var(--border); font-size: 12px; }
  .token-bar label { color: var(--muted); white-space: nowrap; }
  .token-bar input { flex: 1; max-width: 280px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 8px; font-size: 12px; font-family: monospace; }
  .token-bar .hint { color: var(--muted); font-size: 11px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 0; }
  .chip {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }

  .composer { display: flex; gap: 8px; padding: 12px 16px; }
  textarea {
    flex: 1; resize: none; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px;
    font-family: inherit; min-height: 44px;
  }
  button {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 0 18px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
  button.danger { background: var(--red); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 4px 10px; font-size: 12px; }
  button.select-btn { background: var(--panel-2); border: 1px solid var(--accent); color: var(--accent); font-size: 12px; padding: 4px 10px; border-radius: 6px; }
  button.select-btn:hover { background: var(--accent); color: white; }
  .thread-heading { padding: 10px 16px 0; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

  #thread { padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 24px; }
  .turn { display: flex; flex-direction: column; gap: 16px; }
  .msg-user {
    align-self: flex-end; background: var(--accent); color: white;
    padding: 10px 14px; border-radius: 12px 12px 2px 12px; max-width: 80%; font-size: 14px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; max-width: 92%;
  }
  .badges { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge.intent { color: var(--accent); border-color: var(--accent); }
  .badge.ok { color: var(--green); border-color: var(--green); }
  .badge.blocked, .badge.error { color: var(--red); border-color: var(--red); }
  .badge.no_answer { color: var(--amber); border-color: var(--amber); }
  .badge.high, .badge.destructive { color: var(--red); border-color: var(--red); }
  .badge.medium, .badge.write { color: var(--amber); border-color: var(--amber); }
  .badge.low, .badge.read { color: var(--green); border-color: var(--green); }
  .badge.accept { color: var(--green); border-color: var(--green); }
  .badge.revise { color: var(--amber); border-color: var(--amber); }
  .badge.reject { color: var(--red); border-color: var(--red); }

  .answer { white-space: pre-wrap; font-size: 14px; line-height: 1.55; }
  .section-title { font-size: 12px; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  .rc, .imp {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel-2);
  }
  .rc .cause, .imp .rec { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
  .rc .evidence, .imp .meta { font-size: 12.5px; color: var(--muted); }
  .imp .example { margin-top: 6px; }

  /* candidate cards */
  .candidate-card {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    background: var(--panel-2); cursor: default;
  }
  .candidate-card.selected { border-color: var(--accent); }
  .candidate-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .candidate-id { font-size: 12px; color: var(--accent); font-family: monospace; }
  .candidate-desc { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }

  pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 12.5px; overflow-x: auto; margin: 4px 0;
    white-space: pre-wrap; word-break: break-word;
  }
  details { margin-top: 8px; }
  summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .trace-step { display: flex; gap: 8px; font-size: 12px; padding: 4px 0; border-bottom: 1px dashed var(--border); }
  .trace-step .step { color: var(--accent); min-width: 130px; }

  aside {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; align-self: start; position: sticky; top: 16px;
  }
  aside h2 { font-size: 13px; margin: 0 0 10px; }
  aside label { font-size: 12px; color: var(--muted); display: block; margin: 8px 0 4px; }
  aside select, aside input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  .spinner {
    width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: white;
    border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .step-list { list-style: none; padding: 0; margin: 0; }
  .step-list li { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; font-size: 13px; }
  .step-list li::before { content: "✓"; color: var(--green); font-size: 12px; margin-top: 1px; }

  /* Operational workspace refresh */
  :root {
    --surface: #e6eaf1; --paper: #f4f6f9; --ink: #172033; --ink-soft: #667085;
    --line: #cfd6e1; --navy: #16213a; --blue: #2563eb; --blue-wash: #e1ebff;
    --success-wash: #ecfdf3; --warning-wash: #fffaeb; --danger-wash: #fef3f2;
    --shadow: 0 14px 36px rgba(16, 24, 40, .08); --font-ui: Inter, Pretendard, "Apple SD Gothic Neo", sans-serif;
  }
  html, body { min-height: 100%; overflow-x: clip; }
  body { background: var(--surface); color: var(--ink); font-family: var(--font-ui); }
  header { max-width: 1240px; margin: 0 auto; padding: 22px 28px; border: 0; }
  header h1 { color: var(--navy); font-size: 20px; letter-spacing: -.03em; }
  header h1::before { content: "SQL"; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 22px; margin-right: 9px; border-radius: 5px; background: var(--navy); color: var(--paper); font-size: 9px; letter-spacing: .08em; vertical-align: 2px; }
  header .sub { color: var(--ink-soft); }
  #health-dot { box-shadow: 0 0 0 4px var(--success-wash); }
  .layout { display: block; max-width: 1240px; padding: 0 28px 42px; }
  .main { overflow: visible; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); }
  .token-bar { gap: 12px; padding: 13px 20px; border-bottom: 1px solid var(--line); background: #e9edf4; border-radius: 18px 18px 0 0; }
  .token-bar label { color: var(--navy); font-weight: 700; font-size: 12px; }
  .token-bar input { max-width: 250px; min-height: 32px; border-color: var(--line); background: var(--paper); color: var(--ink); border-radius: 7px; }
  .token-bar .hint { color: var(--ink-soft); }
  .chips { gap: 7px; padding: 18px 20px 4px; }
  .chip { background: var(--paper); color: var(--ink-soft); border-color: var(--line); padding: 7px 12px; transition: border-color .15s, background .15s, color .15s; }
  .chip:hover { border-color: var(--blue); background: var(--blue-wash); color: var(--blue); }
  .composer { align-items: stretch; gap: 10px; padding: 14px 20px 12px; }
  textarea { min-height: 58px; padding: 15px; background: #ebeff5; color: var(--ink); border-color: var(--line); border-radius: 10px; line-height: 1.5; }
  textarea:focus { outline: 3px solid var(--blue-wash); border-color: var(--blue); }
  button { min-height: 42px; background: var(--navy); border-radius: 9px; padding: 0 16px; transition: transform .15s, background .15s; white-space: nowrap; }
  button:hover:not(:disabled) { background: var(--blue); transform: translateY(-1px); }
  button:focus-visible, .chip:focus-visible { outline: 3px solid var(--blue-wash); outline-offset: 2px; }
  button.secondary { background: #dce3ed; color: var(--navy); border-color: #c4cedc; }
  button.secondary:hover:not(:disabled) { background: #cdd7e5; color: var(--navy); }
  button.ghost { min-height: 34px; margin-top: 10px; padding: 0 12px; background: #dce8ff !important; border: 1px solid #9db9f2 !important; color: #123b86 !important; font-size: 13px; font-weight: 700; opacity: 1; }
  button.ghost:hover:not(:disabled) { background: #c9dbff !important; color: #102f69 !important; }
  .thread-heading { margin: 0 20px; padding: 11px 0 16px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 11px; letter-spacing: .02em; text-transform: none; }
  #thread { padding: 10px 20px 32px; gap: 26px; }
  .msg-user { background: var(--navy); border-radius: 14px 14px 3px 14px; box-shadow: 0 4px 12px rgba(22,33,58,.16); }
  .card { max-width: 100%; padding: 20px; background: var(--paper); border-color: var(--line); border-radius: 13px; box-shadow: 0 2px 5px rgba(16,24,40,.03); }
  .badge { border-color: var(--line); background: #e9edf4; font-weight: 700; letter-spacing: .02em; }
  .badge.ok, .badge.accept { color: #027a48; border-color: #abefc6; background: var(--success-wash); }
  .badge.blocked, .badge.error, .badge.reject { color: #b42318; border-color: #fecdca; background: var(--danger-wash); }
  .badge.no_answer, .badge.medium, .badge.write, .badge.revise { color: #b54708; border-color: #fedf89; background: var(--warning-wash); }
  .answer { color: var(--ink); line-height: 1.7; }
  .section-title { color: var(--ink-soft); font-weight: 700; letter-spacing: .08em; }
  .rc, .imp, .candidate-card { border-color: var(--line); background: #e9edf4; border-radius: 10px; padding: 13px 14px; }
  .spinner { border-color: #c4cedc; border-top-color: var(--blue); }
  .rc .cause, .imp .rec { color: var(--navy); }
  .rc .evidence, .imp .meta, .candidate-desc { color: var(--ink-soft); }
  .candidate-card.selected { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-wash); }
  .candidate-id { color: var(--blue); }
  pre { background: #101828; border: 0; color: #e4e7ec; border-radius: 9px; padding: 14px; }
  summary { color: var(--ink-soft); }
  .trace-step { border-color: var(--line); }
  .trace-step .step { color: var(--blue); }
  @media (max-width: 680px) {
    header { padding: 18px 16px; gap: 7px; }
    header .sub[style] { width: 100%; margin-left: 0 !important; }
    .layout { padding: 0 12px 24px; }
    .token-bar { align-items: flex-start; flex-wrap: wrap; padding: 13px 14px; }
    .token-bar input { max-width: none; width: 100%; }
    .composer { flex-wrap: wrap; padding: 12px 14px; }
    textarea { width: 100%; flex-basis: 100%; }
    .composer button { flex: 1; }
    .chips, #thread { padding-left: 14px; padding-right: 14px; }
    .thread-heading { margin: 0 14px; }
    .card { padding: 15px; }
    .msg-user { max-width: 94%; }
  }
</style>
</head>
<body>

<header>
  <h1>Oracle SQL Copilot</h1>
  <span class="sub">무엇이든 하나의 입력창에 물어보세요 — SQL 생성 · SQL 검증 · 운영 SQL 탐색·진단을 서버가 알아서 판단합니다</span>
  <span class="sub" style="margin-left:auto"><span id="health-dot"></span><span id="health-text">서버 확인 중…</span></span>
</header>

<div class="layout">
  <div class="main">
    <!-- 승인책임자 토큰 입력 (보호된 흐름에서만 서버가 검사) -->
    <div class="token-bar">
      <label>X-Approver-Token</label>
      <input id="approver-token" type="password" placeholder="승인책임자 토큰 (.env의 APPROVER_TOKEN)" value="demo-approver-token">
      <span class="hint">SQL 생성·검증·운영 탐색으로 판단되면 유효한 토큰이 필요합니다. 일반 진단·지식 질문은 토큰 없이 동작합니다</span>
    </div>

    <div class="chips" id="chips"></div>
    <div class="composer">
      <textarea id="req-input" placeholder="예: 주문과 고객을 조인하는 쿼리가 느린데 원인과 개선안을 알려줘 / SELECT 문 / 필요한 요구사항 등 무엇이든 입력하세요"></textarea>
      <button id="send-btn">보내기</button>
      <button id="diagnose-btn" class="secondary">실행계획 진단</button>
    </div>
    <div class="thread-heading">"실행계획 진단"은 입력을 SQL로 보고 토큰 없이 바로 실행계획 기반 진단을 요청합니다(기존 /query 경로) · 최신 요청이 위에 표시됩니다</div>
    <div id="thread"></div>
  </div>

</div>

<script>
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function approverToken() {
  return $("#approver-token").value.trim();
}

let sessionId = "";

async function postJSON(url, body, withToken=false) {
  const headers = {"content-type": "application/json"};
  if (withToken) {
    const tok = approverToken();
    if (tok) headers["X-Approver-Token"] = tok;
  }
  const res = await fetch(url, {
    method: "POST", headers,
    body: JSON.stringify(body),
  });
  const raw = await res.text();
  if (res.status === 401) throw Object.assign(new Error("이 보호된 요청에는 X-Approver-Token 헤더가 필요합니다 (401)"), {raw});
  if (res.status === 403) throw Object.assign(new Error("유효하지 않은 X-Approver-Token입니다 (403)"), {raw});
  try {
    return JSON.parse(raw);
  } catch {
    const err = new Error(
      `서버가 JSON이 아닌 응답을 반환했습니다 (HTTP ${res.status}). 잠시 후 다시 시도해 주세요.`
    );
    err.raw = raw.slice(0, 500);
    throw err;
  }
}

// ---------- health check ----------
async function checkHealth() {
  const dot = $("#health-dot"), txt = $("#health-text");
  try {
    const r = await fetch("api/health");
    if (r.ok) { dot.className = "ok"; txt.textContent = "서버 연결됨"; }
    else throw new Error();
  } catch {
    dot.className = "bad"; txt.textContent = "서버에 연결할 수 없음";
  }
}
checkHealth();

// ---------- example chips (네 가지 흐름을 한 입력창에서 모두 시연) ----------
const EXAMPLES = [
  "2026년 9월 기준 고객별 주문 총액과 건수를 조회하는 쿼리가 필요합니다",
  "이 SQL 검증해줘 SELECT customer_id FROM orders",
  "SELECT o.order_id, c.customer_name FROM orders o, customers c WHERE o.customer_id = c.customer_id",
  "주문과 고객 조인 쿼리가 느린 것을 찾고 싶어요",
  "결제 내역을 emp_id로 조회하는 쿼리가 느려요",
  "풀 테이블 스캔은 왜 성능에 나쁜 영향을 주나요? (지식 질문)",
  "UPDATE orders SET status='DONE' WHERE order_id=1",
];

const chipsEl = $("#chips");
EXAMPLES.forEach(q => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = q;
  b.onclick = () => { $("#req-input").value = q; $("#req-input").focus(); };
  chipsEl.appendChild(b);
});

// ---------- mode → 한글 라벨 (흐름 구분 표시) ----------
const MODE_LABELS = {
  business_requirement: "SQL 생성",
  sql_validation: "SQL 검증",
  candidate_search: "운영 SQL 탐색",
  candidate_diagnose: "실행계획 진단",
  diagnosis: "실행계획 진단",
  knowledge: "지식 질문",
};

function modeBadge(data) {
  const label = MODE_LABELS[data.mode] || (data.intent ? data.intent : "");
  return label ? `<span class="badge intent">${escapeHtml(label)}</span>` : "";
}

// ---------- send handler (단일 입력 → /query, 서버가 의도 판단) ----------
const inputEl = $("#req-input");
const sendBtn = $("#send-btn");
const diagnoseBtn = $("#diagnose-btn");
const thread = $("#thread");

// 새 요청(턴)마다 .turn 래퍼를 만들어 #thread 맨 앞에 꽂는다 — 턴 안에서는 질문→답변 순서를
// 유지하면서, 턴들 사이에서는 최신 요청이 위로 오게 한다.
function newTurn() {
  const turn = document.createElement("div");
  turn.className = "turn";
  thread.insertBefore(turn, thread.firstChild);
  return turn;
}

// withToken=false로 보내면 항상 기존 /query 진단 경로(run_query)로 간다 — 토큰 필드에 값이
// 있어도 무시하고 "이 SQL을 진단해줘"를 결정적으로 보장한다("수정해서 재진단" 버튼용).
async function doSend(withToken = true, labelText) {
  const q = inputEl.value.trim();
  if (!q) return;
  inputEl.value = "";
  sendBtn.disabled = true;
  diagnoseBtn.disabled = true;
  (withToken ? sendBtn : diagnoseBtn).innerHTML = '<span class="spinner"></span>';

  const turn = newTurn();

  const userBubble = document.createElement("div");
  userBubble.className = "msg-user";
  userBubble.textContent = q;
  turn.appendChild(userBubble);

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<span class="spinner"></span> ${labelText || "처리 중…"}`;
  turn.appendChild(card);
  turn.scrollIntoView({behavior: "smooth", block: "start"});

  const body = {question: q, session_id: sessionId};
  try {
    const data = await postJSON("/query", body, withToken);
    if (data.session_id) sessionId = data.session_id;
    data.__originalInput = q; // 진단 결과에서 "수정해서 재진단"할 때 재사용
    renderByMode(card, data);
  } catch (e) {
    card.innerHTML = `<div class="badges"><span class="badge error">error</span></div>
      <div class="answer">${escapeHtml(e.message)}</div>
      ${e.raw ? `<details><summary>원본 응답 보기</summary><pre>${escapeHtml(e.raw)}</pre></details>` : ""}`;
  } finally {
    sendBtn.disabled = false;
    diagnoseBtn.disabled = false;
    sendBtn.textContent = "보내기";
    diagnoseBtn.textContent = "실행계획 진단";
  }
}

// SQL 블록을 편집해서 재요청할 수 있게 입력창에 채워준다 (```sql ...``` 펜스는 벗겨낸다).
function stripSqlFences(text) {
  const m = /^```(?:sql)?\s*([\s\S]*?)\s*```$/i.exec((text || "").trim());
  return (m ? m[1] : text || "").trim();
}

function editSqlAndFocus(rawSql) {
  inputEl.value = stripSqlFences(rawSql);
  inputEl.focus();
  inputEl.scrollIntoView({behavior: "smooth", block: "center"});
}

sendBtn.onclick = () => doSend(true);
diagnoseBtn.onclick = () => doSend(false, "실행계획 진단 중…");
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); }
});

// ---------- render helpers ----------
function renderTrace(data) {
  if (!data.trace || !data.trace.length) return "";
  return `<details><summary>트레이스 (${data.trace.length} steps)</summary>
    ${data.trace.map(t => `<div class="trace-step"><span class="step">${escapeHtml(t.step)}</span><span>${escapeHtml(JSON.stringify(t.output))}</span></div>`).join("")}
  </details>`;
}

function renderAnalysis(analysis) {
  const parts = [];
  const causes = analysis?.root_causes || [];
  if (causes.length) {
    parts.push('<div class="section-title">원인</div>');
    causes.forEach(c => {
      const sevClass = c.severity === "높음" ? "high" : c.severity === "보통" ? "medium" : "low";
      parts.push(`<div class="rc">
        <div class="cause"><span class="badge ${sevClass}">${escapeHtml(c.severity)}</span> ${escapeHtml(c.cause)}</div>
        <div class="evidence">근거: ${escapeHtml(c.evidence)}</div>
      </div>`);
    });
  }
  const improvements = analysis?.improvements || [];
  if (improvements.length) {
    parts.push('<div class="section-title">개선안</div>');
    improvements.forEach((imp, i) => {
      const riskClass = imp.risk_level || "read";
      parts.push(`<div class="imp">
        <div class="rec"><span class="badge ${riskClass}">${escapeHtml(riskClass)}</span> ${escapeHtml(imp.recommendation)}</div>
        <div class="meta">대상 원인: ${escapeHtml(imp.target_cause)} · 기대효과: ${escapeHtml(imp.expected_effect)}</div>
        ${imp.example ? `<pre class="example">${escapeHtml(imp.example)}</pre>` : ""}
      </div>`);
    });
  }
  return parts.join("");
}

// SQL 생성 (mode: business_requirement)
function renderGenerate(card, data) {
  const parts = [];
  parts.push(`<div class="badges">
    <span class="badge ${escapeHtml(data.status)}">${escapeHtml(data.status)}</span>
    ${modeBadge(data)}
  </div>`);

  if (data.status === "awaiting_plan_approval") {
    parts.push(`<div class="answer">${escapeHtml(data.answer || "계획 승인이 필요합니다.")}</div>`);
    if (data.requirement_plan?.length) {
      parts.push('<div class="section-title">승인할 처리 계획</div><ul class="step-list">');
      data.requirement_plan.forEach(step => parts.push(`<li>${escapeHtml(step)}</li>`));
      parts.push('</ul>');
    }
    parts.push('<div class="row"><button class="plan-approve-btn">계획 승인 후 SQL 생성</button><button class="secondary plan-reject-btn">거절</button></div>');
    card.innerHTML = parts.join("");
    $(".plan-approve-btn", card).onclick = () => submitPlanDecision(data.session_id, "approve", card);
    $(".plan-reject-btn", card).onclick = () => submitPlanDecision(data.session_id, "reject", card);
    return;
  }

  if (data.status !== "ok") {
    parts.push(`<div class="answer">${escapeHtml(data.reason || data.answer || "응답 없음")}</div>`);
    card.innerHTML = parts.join("");
    return;
  }

  parts.push(`<div class="answer">${escapeHtml(data.answer || "")}</div>`);

  if (data.steps_completed && data.steps_completed.length) {
    parts.push('<div class="section-title">처리 단계</div><ul class="step-list">');
    data.steps_completed.forEach(s => parts.push(`<li>${escapeHtml(s)}</li>`));
    parts.push("</ul>");
  }

  if (data.sql_draft) {
    parts.push('<div class="section-title">생성된 SQL 초안</div>');
    parts.push(`<pre>${escapeHtml(data.sql_draft)}</pre>`);
    parts.push('<button class="ghost edit-sql-btn" data-role="draft">✏️ 수정해서 재요청</button>');
  }

  if (data.validation) {
    const v = data.validation;
    parts.push(`<div class="section-title">검증 결과</div>
      <div class="rc">
        <div class="cause"><span class="badge ${escapeHtml(v.result)}">${escapeHtml(v.result?.toUpperCase() || "")}</span> ${escapeHtml(v.reason || "")}</div>
        ${v.annotated_sql ? `<pre>${escapeHtml(v.annotated_sql)}</pre>` : ""}
      </div>`);
  }

  if (data.risk_assessment) {
    const r = data.risk_assessment;
    const lvlClass = r.risk_level === "HIGH" ? "high" : r.risk_level === "MEDIUM" ? "medium" : "low";
    parts.push(`<div class="section-title">실행계획 위험 평가</div>
      <div class="rc">
        <div class="cause"><span class="badge ${lvlClass}">${escapeHtml(r.risk_level)}</span> ${escapeHtml(r.reason || "")}</div>
        <div class="evidence">실행 허용: ${r.allow_execution ? "예" : "아니오"}</div>
      </div>`);
  }

  // 생성된 SQL도 후보/직접 진단과 동일한 근본 원인·개선안 분석을 받는다(review_plan 단계에서
  // 진단 그래프를 함께 호출함 — 실행계획 위험도만으로는 "왜"가 안 보이기 때문).
  parts.push(renderAnalysis(data.analysis));

  parts.push(renderTrace(data));
  card.innerHTML = parts.join("");

  const draftBtn = $(".edit-sql-btn[data-role='draft']", card);
  if (draftBtn) draftBtn.onclick = () => editSqlAndFocus(data.sql_draft);

}

async function submitPlanDecision(session, decision, card) {
  card.innerHTML = '<span class="spinner"></span> 계획 처리 중…';
  try {
    const data = await postJSON(`/plans/${encodeURIComponent(session)}/approve`, {decision}, true);
    if (data.session_id) sessionId = data.session_id;
    renderGenerate(card, data);
  } catch (e) {
    card.innerHTML = `<div class="badges"><span class="badge error">error</span></div><div class="answer">${escapeHtml(e.message)}</div>`;
  }
}

// SQL 검증 (mode: sql_validation)
function renderValidate(card, data) {
  const parts = [];
  parts.push(`<div class="badges">
    <span class="badge ${escapeHtml(data.status)}">${escapeHtml(data.status)}</span>
    ${data.result ? `<span class="badge ${escapeHtml(data.result)}">${escapeHtml(data.result?.toUpperCase() || "")}</span>` : ""}
    ${modeBadge(data)}
  </div>`);

  if (data.status === "blocked") {
    parts.push(`<div class="answer">${escapeHtml(data.reason || "차단됨")}</div>`);
    card.innerHTML = parts.join("");
    return;
  }

  parts.push(`<div class="answer">${escapeHtml(data.answer || data.reason || "")}</div>`);

  if (data.annotated_sql) {
    parts.push('<div class="section-title">승인 주석 SQL</div>');
    parts.push(`<pre>${escapeHtml(data.annotated_sql)}</pre>`);
    if (data.result !== "accept") {
      parts.push('<button class="ghost edit-sql-btn" data-role="annotated">✏️ 수정 후 다시 검증</button>');
    }
  }

  if (data.review_id) {
    parts.push(`<div class="rc"><div class="evidence">review_id: ${escapeHtml(data.review_id)} · query_name: ${escapeHtml(data.query_name || "")} · ${escapeHtml(data.reviewed_at || "")}</div></div>`);
  }

  parts.push(renderTrace(data));
  card.innerHTML = parts.join("");

  const annotatedBtn = $(".edit-sql-btn[data-role='annotated']", card);
  if (annotatedBtn) annotatedBtn.onclick = () => editSqlAndFocus(data.annotated_sql);
}

// 후보 탐색 (mode: candidate_search)
function renderCandidates(card, data) {
  const parts = [];
  parts.push(`<div class="badges">
    <span class="badge ${escapeHtml(data.status)}">${escapeHtml(data.status)}</span>
    ${modeBadge(data)}
  </div>`);

  if (data.status !== "ok") {
    parts.push(`<div class="answer">${escapeHtml(data.reason || data.answer || "응답 없음")}</div>`);
    card.innerHTML = parts.join("");
    return;
  }

  parts.push(`<div class="answer">${escapeHtml(data.answer || "")}</div>`);

  const candidates = data.candidates || [];
  if (candidates.length) {
    parts.push('<div class="section-title">후보 SQL 목록</div>');
    candidates.forEach(c => {
      parts.push(`<div class="candidate-card" id="cand-${escapeHtml(c.sql_id)}">
        <div class="candidate-header">
          <span class="candidate-id">${escapeHtml(c.sql_id)}</span>
          <button class="select-btn" data-sqlid="${escapeHtml(c.sql_id)}">진단 요청</button>
        </div>
        <div class="candidate-desc">${escapeHtml(c.description || "")}</div>
        <pre>${escapeHtml(c.masked_sql || "")}</pre>
      </div>`);
    });
  } else {
    parts.push('<div class="answer" style="color:var(--muted)">관련 후보 SQL을 찾지 못했습니다.</div>');
  }

  parts.push(renderTrace(data));
  card.innerHTML = parts.join("");

  $$(".select-btn", card).forEach(btn => {
    const cand = candidates.find(c => c.sql_id === btn.dataset.sqlid);
    btn.onclick = () => diagnoseCandidateSqlId(btn.dataset.sqlid, card.parentElement, cand?.masked_sql || "");
  });
}

async function diagnoseCandidateSqlId(sqlId, threadEl, maskedSql) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<span class="spinner"></span> <b>${escapeHtml(sqlId)}</b> 진단 중…`;
  threadEl.appendChild(card);
  card.scrollIntoView({behavior: "smooth", block: "end"});

  const candidateEl = $(`#cand-${sqlId}`);
  if (candidateEl) candidateEl.classList.add("selected");

  try {
    const data = await postJSON("/candidates/diagnose", {sql_id: sqlId, session_id: sessionId}, true);
    if (data.session_id) sessionId = data.session_id;
    // 마스킹된 SQL이라도 "수정해서 재진단" 시작점으로는 유용하다(값만 채워 넣으면 됨).
    data.__originalInput = maskedSql || "";
    renderByMode(card, data);
  } catch (e) {
    card.innerHTML = `<div class="badges"><span class="badge error">error</span></div>
      <div class="answer">${escapeHtml(e.message)}</div>`;
  }
}

// 실행계획 진단 / 지식 질문 (mode: diagnosis | candidate_diagnose | knowledge, 상태 오류의 기본 렌더러)
function renderDiagnosis(card, data) {
  const parts = [];
  parts.push(`<div class="badges">
    <span class="badge ${escapeHtml(data.status)}">${escapeHtml(data.status)}</span>
    ${modeBadge(data)}
    ${data.sql_id ? `<span class="badge">${escapeHtml(data.sql_id)}</span>` : ""}
  </div>`);

  if (data.status !== "ok") {
    parts.push(`<div class="answer">${escapeHtml(data.reason || "응답 없음")}</div>`);
    card.innerHTML = parts.join("");
    return;
  }

  parts.push(`<div class="answer">${escapeHtml(data.analysis?.summary || data.answer || "")}</div>`);
  parts.push(renderAnalysis(data.analysis));

  const isSqlDiagnosis = data.mode === "diagnosis" || data.mode === "candidate_diagnose";
  if (isSqlDiagnosis && data.__originalInput) {
    parts.push('<button class="ghost edit-sql-btn" data-role="diag">✏️ 수정해서 재진단</button>');
  }

  if (data.contexts && data.contexts.length) {
    parts.push(`<details><summary>참조 컨텍스트 (${data.contexts.length})</summary>
      ${data.contexts.map(c => `<div class="section-title">${escapeHtml(c.doc_id || "")}</div><pre>${escapeHtml(c.text)}</pre>`).join("")}
    </details>`);
  }

  parts.push(renderTrace(data));
  card.innerHTML = parts.join("");


  const diagBtn = $(".edit-sql-btn[data-role='diag']", card);
  if (diagBtn) diagBtn.onclick = () => editSqlAndFocus(data.__originalInput);
}

// ---------- mode → renderer dispatch (서버가 분류한 결과를 UI가 구분해 보여준다) ----------
function renderByMode(card, data) {
  switch (data.mode) {
    case "business_requirement": return renderGenerate(card, data);
    case "sql_validation": return renderValidate(card, data);
    case "candidate_search": return renderCandidates(card, data);
    default: return renderDiagnosis(card, data); // diagnosis | candidate_diagnose | knowledge | blocked/no_answer/error(모드 없음)
  }
}

</script>
